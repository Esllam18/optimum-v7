name: Optimum V7 CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimum-v7-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.16.0'
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_OPTIMUM_RELEASE: ${{ github.sha }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:release
      - run: npm run release:preflight

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-visual.txt
      - run: python -m pip install -r requirements-visual.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/v7-responsive-browser.py

  production-artifact:
    runs-on: ubuntu-latest
    needs: [contracts, visual]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Load safe CI public defaults when repository variables are absent
        shell: bash
        run: |
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!key}" ]; then
              value=$(grep -E "^${key}=" .env.example | head -1 | cut -d= -f2-)
              echo "${key}=${value}" >> "$GITHUB_ENV"
            fi
          done
      - run: npm run release:env:strict
      - run: npm run build
      - run: npm run release:package
      - name: Pack standalone artifact
        run: tar -C .next/standalone -czf optimum-v7-standalone-${GITHUB_SHA}.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: optimum-v7-standalone-${{ github.sha }}
          path: optimum-v7-standalone-${{ github.sha }}.tgz
          retention-days: 14

  container-smoke:
    runs-on: ubuntu-latest
    needs: [contracts, visual]
    steps:
      - uses: actions/checkout@v6
      - name: Load safe CI public defaults when repository variables are absent
        shell: bash
        run: |
          for key in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!key}" ]; then
              value=$(grep -E "^${key}=" .env.example | head -1 | cut -d= -f2-)
              echo "${key}=${value}" >> "$GITHUB_ENV"
            fi
          done
      - name: Build production image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" \
            --build-arg NEXT_PUBLIC_OPTIMUM_RELEASE="${GITHUB_SHA}" \
            -t optimum-v7:${GITHUB_SHA} .
      - name: Start production container
        run: docker run -d --rm --name optimum-v7-ci -p 3000:3000 -e OPTIMUM_RELEASE="${GITHUB_SHA}" optimum-v7:${GITHUB_SHA}
      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/tmp/health.json; then cat /tmp/health.json; exit 0; fi
            sleep 1
          done
          docker logs optimum-v7-ci || true
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Post-deploy smoke against exact container
        run: BASE_URL=http://127.0.0.1:3000 ALLOW_HTTP=1 EXPECTED_RELEASE="${GITHUB_SHA}" node scripts/postdeploy-smoke.mjs
      - if: always()
        run: docker logs optimum-v7-ci || true
